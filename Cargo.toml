[package]
name = "paymerge-pdf"
version = "7.1.0"
edition = "2024"
rust-version = "1.100"
description = "ASC 实验室发票三合一桌面工具"
license = "LicenseRef-Internal"
default-run = "paymerge-pdf"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
regex = "1"
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["glow", "default_fonts", "clipboard", "links"] }
rfd = { version = "0.18", optional = true, default-features = false }
semver = "1"
sha2 = "0.10"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "json"] }
zip = { version = "=9.8.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }

[[bin]]
name = "paymerge-pdf"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "paymerge-updater"
path = "src/bin/updater.rs"

[[example]]
name = "acceptance"
path = "examples/acceptance.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
